# Premium dark glass base — pinned, never rewritten at runtime.
# Per-personality color shifts happen via CSS variables in ui/theme.py.
[theme]
base = "dark"
primaryColor = "#7AA7FF"
backgroundColor = "#050505"
secondaryBackgroundColor = "#0b0b0d"
textColor = "#e8edf5"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false
